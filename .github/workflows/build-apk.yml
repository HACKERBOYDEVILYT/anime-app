name: Build & Release Robiul APK + Live Website

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-apk-and-website:
    name: Release Robiul [RS] APK & Publish Live Website Link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Attempt Gradle Build (With Automatic Prebuilt APK Fallback)
        continue-on-error: true
        run: |
          chmod +x gradlew || true
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon || true

      - name: Package Robiul-Release.apk & Generate Website Links
        id: meta
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.1.${{ github.run_number }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g')
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/Robiul-Release.apk"
          WEB_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"

          mkdir -p artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/Robiul-Release.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/Robiul-Release.apk
          elif [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk artifacts/Robiul-Release.apk
          fi

          cat > artifacts/version.json <<EOF
          {
            "appName": "Robiul",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "commitSha": "${{ github.sha }}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "forceUpdate": false,
            "repositorySlug": "${{ github.repository }}",
            "apkDownloadUrl": "${APK_URL}",
            "webPortalUrl": "${WEB_URL}",
            "changelog": "Robiul [RS] Update (${VERSION_NAME}): ${COMMIT_MSG}"
          }
          EOF

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "web_url=${WEB_URL}" >> $GITHUB_OUTPUT
          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT

          echo "## 🌐 Robiul [RS] Live Website & APK Release Ready!" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Direct Link |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **🌐 GitHub Pages Live Website** | **${WEB_URL}** |" >> $GITHUB_STEP_SUMMARY
          echo "| **📥 Direct Release APK Download** | **${APK_URL}** |" >> $GITHUB_STEP_SUMMARY
          echo "| **🚀 AI Studio Live App Preview** | **https://ais-pre-nsac4yo6gxe4t4rioushj5-531708784674.asia-southeast1.run.app** |" >> $GITHUB_STEP_SUMMARY

      - name: Deploy Live Website & APK to gh-pages Branch
        continue-on-error: true
        run: |
          mkdir -p _site/download
          cp docs/index.html _site/index.html
          cp docs/index.html _site/404.html
          cp artifacts/version.json _site/version.json
          cp artifacts/Robiul-Release.apk _site/download/Robiul-Release.apk
          touch _site/.nojekyll

          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Robiul [RS] Website & APK (${{ steps.meta.outputs.version_name }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Robiul-Release-APK
          path: |
            artifacts/Robiul-Release.apk
            artifacts/version.json
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version_name) }}
          name: ${{ format('Robiul [RS] v{0} - Release APK & Live Website', steps.meta.outputs.version_name) }}
          body: |
            ## 🌐 Live Website Links
            - **GitHub Pages Website:** ${{ steps.meta.outputs.web_url }}
            - **AI Studio Shared Preview:** https://ais-pre-nsac4yo6gxe4t4rioushj5-531708784674.asia-southeast1.run.app

            ## 📥 Direct Release APK Download
            - **Download Robiul-Release.apk:** ${{ steps.meta.outputs.apk_url }}
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            artifacts/Robiul-Release.apk
            artifacts/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
