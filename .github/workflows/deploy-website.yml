name: Deploy Live Website (GitHub Pages & gh-pages Branch)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "robiul-pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Instant Deploy Robiul [RS] Website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.meta.outputs.web_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Live version.json & Prepare Static Site
        id: meta
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.1.${{ github.run_number }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g')
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/Robiul-Release.apk"
          WEB_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"

          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/index.html _site/404.html
          touch _site/.nojekyll

          cat > _site/version.json <<EOF
          {
            "appName": "Robiul",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "commitSha": "${{ github.sha }}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "forceUpdate": false,
            "repositorySlug": "${{ github.repository }}",
            "apkDownloadUrl": "${APK_URL}",
            "webPortalUrl": "${WEB_URL}",
            "changelog": "Robiul [RS] Update (${VERSION_NAME}): ${COMMIT_MSG}"
          }
          EOF

          echo "web_url=${WEB_URL}" >> $GITHUB_OUTPUT
          echo "## 🌐 Your Live Website Link is Ready!" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages Live Website URL:** [${WEB_URL}](${WEB_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **AI Studio Live Preview URL:** [https://ais-pre-nsac4yo6gxe4t4rioushj5-531708784674.asia-southeast1.run.app](https://ais-pre-nsac4yo6gxe4t4rioushj5-531708784674.asia-southeast1.run.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Release URL:** [${APK_URL}](${APK_URL})" >> $GITHUB_STEP_SUMMARY

      - name: Publish Static Website to gh-pages Branch
        continue-on-error: true
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Robiul [RS] Live Website (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Configure GitHub Pages (Auto-Enable Actions Pages)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
