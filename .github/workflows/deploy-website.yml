name: Deploy Live Website (GitHub Pages)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "robiul-pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy Robiul [RS] Live Website & Output Link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Static Website & Live version.json
        id: meta
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.1.${{ github.run_number }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g')
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/Robiul-Release.apk"
          WEB_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"

          mkdir -p _site/download
          cp docs/index.html _site/index.html
          cp docs/index.html _site/404.html
          if [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk _site/download/Robiul-Release.apk
          fi
          touch _site/.nojekyll

          cat > _site/version.json <<EOF
          {
            "appName": "Robiul",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "commitSha": "${{ github.sha }}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "forceUpdate": false,
            "repositorySlug": "${{ github.repository }}",
            "apkDownloadUrl": "${APK_URL}",
            "webPortalUrl": "${WEB_URL}",
            "changelog": "Robiul [RS] Update (${VERSION_NAME}): ${COMMIT_MSG}"
          }
          EOF

          echo "web_url=${WEB_URL}" >> $GITHUB_OUTPUT
          echo "## 🌐 Your Live Website Link is Ready!" >> $GITHUB_STEP_SUMMARY
          echo "### 👉 Live Website URL: [${WEB_URL}](${WEB_URL})" >> $GITHUB_STEP_SUMMARY
          echo "### 👉 Direct APK Download on Website: [${WEB_URL}download/Robiul-Release.apk](${WEB_URL}download/Robiul-Release.apk)" >> $GITHUB_STEP_SUMMARY
          echo "### 👉 AI Studio Live Preview URL: [https://ais-pre-nsac4yo6gxe4t4rioushj5-531708784674.asia-southeast1.run.app](https://ais-pre-nsac4yo6gxe4t4rioushj5-531708784674.asia-southeast1.run.app)" >> $GITHUB_STEP_SUMMARY

      - name: Publish Website to gh-pages Branch & Auto-Enable GitHub Pages
        continue-on-error: true
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Robiul [RS] Live Website (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
